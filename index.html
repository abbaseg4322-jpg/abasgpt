<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد المستندات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#14231f;--mut:#5d6e68;--line:#d3ddd8;--acc:#0f6b57;--acc2:#e9f4f0;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1714;--card:#16221e;--ink:#e8f0ec;--mut:#8ea39b;--line:#2a3b35;--acc:#3fbf9f;--acc2:#1b2e28;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
:root{padding-top:env(safe-area-inset-top,0)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
h1{font-size:1.5rem;margin:0;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--acc2);padding:5px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:9px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px #0002}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.on{display:block}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);cursor:pointer}
.drop.hv,.drop:hover{border-color:var(--acc);color:var(--acc)}
.drop b{display:block;color:var(--ink);font-size:1.05rem}
.file{margin-top:10px;font-size:.92rem;color:var(--acc);font-weight:700;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
select,textarea,input[type=password],input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
select{width:auto;flex:1;min-width:140px}
textarea{min-height:120px;resize:vertical}
button.pri,button.sec{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--acc)}
button.pri{background:var(--acc);color:#fff}
button.pri:disabled{opacity:.5;cursor:wait}
button.sec{background:none;color:var(--acc)}
.out{white-space:pre-wrap;margin-top:6px}
.meta{font-size:.82rem;color:var(--mut);margin-top:8px}
.err{color:var(--err);font-weight:700}
img.prev{max-width:100%;max-height:300px;border-radius:10px;margin-top:10px;display:block}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:460px;width:92%;font-family:inherit}
dialog::backdrop{background:#0008}
dialog label{display:block;font-weight:700;margin:12px 0 4px}
.bar{height:3px;background:var(--acc);width:0;transition:width .3s;border-radius:2px}
@media(max-width:480px){h1{font-size:1.25rem}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>مساعد المستندات</h1>
  <button class="sec" onclick="dlg.showModal()">المزوّدون</button>
</header>
<div class="tabs" role="tablist">
  <button class="on" data-t="p1">الملفات</button>
  <button data-t="p2">نص من صورة</button>
</div>

<section class="panel on" id="p1">
  <div class="drop" id="drop" tabindex="0">
    <b>اسحب ملفًا هنا أو اضغط للاختيار</b>
    PDF ، Word ، Excel ، PowerPoint ، أو صورة
  </div>
  <input type="file" id="f1" hidden accept=".pdf,.docx,.xlsx,.xls,.csv,.pptx,image/*">
  <div class="file" id="fname"></div>
  <div class="row">
    <select id="task">
      <option value="sum">تلخيص</option>
      <option value="qa">سؤال عن المحتوى</option>
      <option value="tr">ترجمة</option>
      <option value="ex">استخراج النص كما هو</option>
    </select>
    <select id="lang"><option>العربية</option><option>English</option><option>Français</option><option>Türkçe</option></select>
  </div>
  <textarea id="q" placeholder="اكتب سؤالك أو تعليمات إضافية (اختياري)"></textarea>
  <div class="row"><button class="pri" id="go1">ابدأ</button><button class="sec" id="cp1">نسخ النتيجة</button></div>
  <div class="bar" id="bar"></div>
  <div class="out" id="out1"></div>
  <div class="meta" id="m1"></div>
</section>

<section class="panel" id="p2">
  <div class="drop" id="drop2" tabindex="0">
    <b>صوّر الورقة أو اختر صورة</b>
    خط يد أو نص مطبوع، عربي أو غيره
  </div>
  <input type="file" id="f2" hidden accept="image/*">
  <img class="prev" id="prev" hidden alt="">
  <div class="row"><button class="pri" id="go2">استخرج النص</button></div>
  <textarea id="out2" placeholder="سيظهر النص هنا وتستطيع تعديله" style="min-height:200px"></textarea>
  <div class="row"><button class="sec" id="cp2">نسخ</button><button class="sec" id="dl2">تنزيل TXT</button></div>
  <div class="meta" id="m2"></div>
</section>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 style="margin:0">المزوّدون الاحتياطيون</h3>
    <p class="meta">Gemini مضبوط في الكود. إذا انتهت حصته ينتقل الموقع تلقائيًا إلى المزوّدين التاليين إن أضفت مفاتيحهم (تُحفظ في متصفحك).</p>
    <label>مفتاح Gemini (يستبدل مفتاح الكود)</label>
    <input type="password" id="k_gem" dir="ltr">
    <label>مفتاح OpenRouter (نص فقط)</label>
    <input type="password" id="k_or" dir="ltr">
    <label>مفتاح Groq (نص فقط)</label>
    <input type="password" id="k_groq" dir="ltr">
    <div class="row"><button class="pri" id="save" value="ok">حفظ</button><button class="sec" value="x">إغلاق</button></div>
  </form>
</dialog>

<script>
/* ====== ضع مفتاحك هنا ====== */
const GEMINI_KEY = ""; // اتركه فارغًا والصق مفتاحك من زر «المزوّدون»
/* ========================== */

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

// تبويبات
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button,.panel").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.t).classList.add("on");
});
// إعدادات
["gem","or","groq"].forEach(n=>$("k_"+n).value=store.get("k_"+n));
$("save").onclick=()=>["gem","or","groq"].forEach(n=>store.set("k_"+n,$("k_"+n).value.trim()));

// ====== الموجّه: تسلسل المزوّدين والمودلات ======
let GEM_MODELS=["gemini-3.8-flash","gemini-3.5-flash-lite"];
(async()=>{ // يجلب المودلات المتاحة فعليًا لمفتاحك، ويبقي القائمة أعلاه احتياطًا
  const k=(store.get("k_gem")||GEMINI_KEY).trim(); if(!k) return;
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",{headers:{"x-goog-api-key":k}});
    const j=await r.json();
    const found=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(m.name)&&!/image|tts|live|audio|embed|robotics|computer/.test(m.name))
      .map(m=>m.name.replace("models/","")).sort().reverse().slice(0,4);
    GEM_MODELS=[...new Set([...found,...GEM_MODELS])];
  }catch(e){}
})();
function providers(needVision){
  const list=[], gk=store.get("k_gem")||GEMINI_KEY;
  if(gk) GEM_MODELS.forEach(m=>list.push({name:"Gemini · "+m,vision:true,limit:300000,run:(p)=>gemini(gk,m,p)}));
  const or=store.get("k_or"), gq=store.get("k_groq");
  if(or&&!needVision) list.push({name:"OpenRouter · llama-3.3-70b",vision:false,limit:60000,run:(p)=>openai("https://openrouter.ai/api/v1/chat/completions",or,"meta-llama/llama-3.3-70b-instruct:free",p)});
  if(gq&&!needVision) list.push({name:"Groq · llama-3.3-70b",vision:false,limit:24000,run:(p)=>openai("https://api.groq.com/openai/v1/chat/completions",gq,"llama-3.3-70b-versatile",p)});
  return list;
}
async function gemini(key,model,{text,images}){
  key=key.trim();
  const parts=[{text}]; (images||[]).forEach(i=>parts.push({inlineData:{mimeType:i.mime,data:i.data}}));
  const base=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const body=JSON.stringify({contents:[{role:"user",parts}]});
  let r=await fetch(base,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body});
  if(r.status===401) r=await fetch(base+"?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body});
  const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
  const t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join(""); if(!t) throw new Error("رد فارغ");
  return t;
}
async function openai(url,key,model,{text}){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},
    body:JSON.stringify({model,messages:[{role:"user",content:text}]})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
  return j.choices[0].message.content;
}
async function ask(payload){
  const hasImg=(payload.images||[]).length>0, errs=[];
  for(const p of providers(hasImg)){
    try{
      const t=payload.text.length>p.limit?payload.text.slice(0,p.limit)+"\n[...تم اقتطاع الباقي]":payload.text;
      return {text:await p.run({...payload,text:t}),by:p.name};
    }catch(e){errs.push(p.name+": "+e.message)}
  }
  throw new Error(errs.length?errs.join("\n"):"لا يوجد مزوّد متاح");
}

// ====== قراءة الملفات ======
const b64=buf=>{let s="",b=new Uint8Array(buf);for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
const fileB64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
async function readFile(f,prog){
  const n=f.name.toLowerCase(), buf=await f.arrayBuffer();
  if(f.type.startsWith("image/")) return {text:"",images:[{mime:f.type,data:b64(buf)}]};
  if(n.endsWith(".pdf")){
    const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise; let t="";
    for(let i=1;i<=pdf.numPages;i++){prog(i/pdf.numPages);const c=await (await pdf.getPage(i)).getTextContent();t+=`\n--- صفحة ${i} ---\n`+c.items.map(x=>x.str).join(" ")}
    if(t.replace(/---.*---|\s/g,"").length>50) return {text:t,images:[]};
    const imgs=[]; // ملف ممسوح ضوئيًا: نرسل أول 6 صفحات كصور
    for(let i=1;i<=Math.min(6,pdf.numPages);i++){
      const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),cv=document.createElement("canvas");
      cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      imgs.push({mime:"image/jpeg",data:cv.toDataURL("image/jpeg",.8).split(",")[1]});
    }
    return {text:"(ملف PDF ممسوح ضوئيًا، الصفحات مرفقة كصور)",images:imgs};
  }
  if(n.endsWith(".docx")) return {text:(await mammoth.extractRawText({arrayBuffer:buf})).value,images:[]};
  if(/\.(xlsx|xls|csv)$/.test(n)){
    const wb=XLSX.read(buf,{type:"array"});
    return {text:wb.SheetNames.map(s=>`--- ورقة: ${s} ---\n`+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join("\n\n"),images:[]};
  }
  if(n.endsWith(".pptx")){
    const z=await JSZip.loadAsync(buf), slides=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.match(/\d+/)-b.match(/\d+/));
    let t=""; for(const k of slides){
      const x=await z.file(k).async("string");
      t+=`\n--- شريحة ${k.match(/\d+/)} ---\n`+[...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ");
    }
    for(const k of Object.keys(z.files).filter(k=>/^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(k))){
      const x=await z.file(k).async("string"); t+="\n[ملاحظات] "+[...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ");
    }
    return {text:t,images:[]};
  }
  throw new Error("نوع الملف غير مدعوم");
}

// ====== الصفحة الأولى ======
let file1=null;
function drop(zone,input,cb){
  zone.onclick=()=>input.click();
  zone.onkeydown=e=>{if(e.key==="Enter")input.click()};
  input.onchange=()=>input.files[0]&&cb(input.files[0]);
  zone.ondragover=e=>{e.preventDefault();zone.classList.add("hv")};
  zone.ondragleave=()=>zone.classList.remove("hv");
  zone.ondrop=e=>{e.preventDefault();zone.classList.remove("hv");e.dataTransfer.files[0]&&cb(e.dataTransfer.files[0])};
}
drop($("drop"),$("f1"),f=>{file1=f;$("fname").textContent="📎 "+f.name});
$("go1").onclick=async()=>{
  const out=$("out1"),m=$("m1"),btn=$("go1"); out.className="out";out.textContent="";m.textContent="";
  if(!file1) return out.innerHTML='<span class="err">اختر ملفًا أولًا</span>';
  btn.disabled=true;
  try{
    out.textContent="جارٍ قراءة الملف…";
    const d=await readFile(file1,p=>$("bar").style.width=(p*100)+"%");
    $("bar").style.width="0";
    const L=$("lang").value,q=$("q").value.trim(),k=$("task").value;
    const ins={sum:`لخّص المحتوى التالي بوضوح في نقاط رئيسية باللغة: ${L}.`,
      qa:`أجب عن السؤال اعتمادًا على المحتوى فقط باللغة: ${L}. إن لم تجد الإجابة فقل ذلك.`,
      tr:`ترجم المحتوى كاملًا إلى: ${L}، مع الحفاظ على بنيته.`,
      ex:`استخرج النص كاملًا كما هو دون تغيير أو تلخيص.`}[k];
    out.textContent="جارٍ المعالجة…";
    const r=await ask({text:`${ins}\n${q?"تعليمات المستخدم: "+q+"\n":""}\n=== المحتوى ===\n${d.text}`,images:d.images});
    out.textContent=r.text; m.textContent="تمت المعالجة بواسطة: "+r.by;
  }catch(e){out.className="out err";out.textContent=e.message}
  btn.disabled=false;
};
$("cp1").onclick=()=>navigator.clipboard.writeText($("out1").textContent);

// ====== الصفحة الثانية: خط اليد ======
let file2=null;
drop($("drop2"),$("f2"),f=>{file2=f;$("prev").src=URL.createObjectURL(f);$("prev").hidden=false});
$("go2").onclick=async()=>{
  const btn=$("go2"),m=$("m2"); m.textContent="";
  if(!file2){m.innerHTML='<span class="err">اختر صورة أولًا</span>';return}
  btn.disabled=true;$("out2").value="جارٍ الاستخراج…";
  try{
    const r=await ask({text:"انسخ كل النص الظاهر في الصورة (مكتوب بخط اليد أو مطبوع) حرفيًا وبنفس ترتيب الأسطر واللغة الأصلية. أرجع النص فقط دون أي شرح. إن كانت كلمة غير واضحة فاكتب [؟] مكانها.",
      images:[{mime:file2.type,data:await fileB64(file2)}]});
    $("out2").value=r.text; m.textContent="تمت المعالجة بواسطة: "+r.by;
  }catch(e){$("out2").value="";m.innerHTML='<span class="err"></span>';m.firstChild.textContent=e.message}
  btn.disabled=false;
};
$("cp2").onclick=()=>navigator.clipboard.writeText($("out2").value);
$("dl2").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("out2").value],{type:"text/plain;charset=utf-8"}));a.download="extracted.txt";a.click()};
</script>
</body>
</html>
